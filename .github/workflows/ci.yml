name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm
          # Keep the major.minor equal to `graal` in gradle/libs.versions.toml; other
          # GraalVM lines (25.0.x, 25.3+) make Truffle fall back to the interpreter.
          version: '25.2'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build, test and publish to a local repository
        run: ./gradlew build publishAllPublicationsToBuildRepository --console=plain
      - name: Verify Maven publications
        run: python3 tools/verify-publications.py
      - name: Test documentation version updates
        run: python3 -m unittest discover -s tools -p 'test_update_readme_versions.py'
