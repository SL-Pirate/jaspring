name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm
          # Keep the major.minor equal to `graal` in gradle/libs.versions.toml; other
          # GraalVM lines (25.0.x, 25.3+) make Truffle fall back to the interpreter.
          version: "25.2"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # Binaryen's wasm-as assembles the Web Image build of browser closures; Ubuntu's package is older than
      # the required 119, so use the pinned release (sha256 in tools/ci/binaryen.sha256).
      - name: Install Binaryen
        run: |
          curl --fail --silent --show-error --location --retry 3 -o binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_$BINARYEN_VERSION/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          echo "$(cat tools/ci/binaryen.sha256)  binaryen.tar.gz" | sha256sum --check
          mkdir -p "$HOME/binaryen" && tar -xzf binaryen.tar.gz --strip-components=1 -C "$HOME/binaryen"
          echo "$HOME/binaryen/bin" >> "$GITHUB_PATH"
          "$HOME/binaryen/bin/wasm-as" --version
        env:
          BINARYEN_VERSION: "133"
      # Node builds and tests the client shim (tools/shim) and runs the Node host tests; only framework developers need it.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install shim test dependencies
        run: pnpm install --frozen-lockfile --dir tools/shim
      - name: Build, test and publish to a local repository
        run: ./gradlew build publishAllPublicationsToBuildRepository -Pjaspring.wasm=true --console=plain
      - name: Record WebAssembly build size
        run: |
          ls -l jaspring-sample/build/jaspring/browser/image/ >> "$GITHUB_STEP_SUMMARY" || echo "no image built" >> "$GITHUB_STEP_SUMMARY"
      - name: Fail when the Web Image or Node host tests were skipped
        run: |
          python3 tools/ci/check-no-skipped.py jaspring-gradle-plugin/build/test-results/test BuildBrowserImageTest
          python3 tools/ci/check-no-skipped.py jaspring-gradle-plugin/build/test-results/test CompileTypescriptTest
          python3 tools/ci/check-no-skipped.py jaspring-typescript/build/test-results/test NodeHostTest
      - name: Verify Maven publications
        run: python3 tools/verify-publications.py
      - name: Test documentation version updates
        run: python3 -m unittest discover -s tools -p 'test_update_readme_versions.py'

  jnpm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build browser packages with the managed toolchain
        shell: bash
        run: ./gradlew :jaspring-sample:bootJar :jaspring-sample:lintTypescript -Pjaspring.wasm=false --configuration-cache --console=plain
      - name: Reuse the cached configuration
        shell: bash
        run: ./gradlew :jaspring-sample:bootJar :jaspring-sample:lintTypescript -Pjaspring.wasm=false --configuration-cache --console=plain
      - name: Reinstall locked packages after clean offline
        shell: bash
        run: ./gradlew :jaspring-sample:clean :jaspring-sample:bootJar -Pjaspring.wasm=false --offline --console=plain
