name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: graalvm
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build, test and publish to a local repository
        run: ./gradlew build publishAllPublicationsToBuildRepository --console=plain
      - name: Verify Maven publications
        run: python3 tools/verify-publications.py
      - name: Test documentation version updates
        run: python3 -m unittest discover -s tools -p 'test_update_readme_versions.py'
