name: Stage Maven Central release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.0.1 or 0.0.1-rc.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: graalvm
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Check committed installation versions
        run: ./gradlew checkReadmeVersions -PreleaseVersion="$RELEASE_VERSION" --console=plain
      - name: Build and test the release
        run: ./gradlew build -PreleaseVersion="$RELEASE_VERSION" --console=plain
      - name: Sign and verify the local release artifacts
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          ./gradlew publishAllPublicationsToBuildRepository -PreleaseVersion="$RELEASE_VERSION" --console=plain
          python3 tools/verify-publications.py --version "$RELEASE_VERSION" --require-signatures
      - name: Upload for review in Central Portal
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: ./gradlew publishToMavenCentral -PreleaseVersion="$RELEASE_VERSION" --console=plain
